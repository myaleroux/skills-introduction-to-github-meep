<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You Are Awesome</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Comic Sans MS", "Trebuchet MS", cursive, sans-serif;
      background: radial-gradient(circle at top, #fff5fd 0%, #ffe29f 35%, #ff8ec3 65%, #7ed7ff 100%);
      overflow: hidden;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(2rem, 8vw, 5rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff2d95, #ff7f11, #ffee32, #35d07f, #2ec4ff, #9b5de5, #ff2d95);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 0.5rem rgba(255, 255, 255, 0.8), 0 0 1rem rgba(255, 45, 149, 0.35);
      animation: glow 1.8s ease-in-out infinite alternate;
      position: relative;
      z-index: 2;
      padding: 1rem;
    }

    .glitter,
    .glitter::before,
    .glitter::after {
      position: fixed;
      inset: -10%;
      content: "";
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.9) 1px, transparent 2px),
        radial-gradient(circle, rgba(255, 221, 87, 0.8) 1px, transparent 2px),
        radial-gradient(circle, rgba(255, 85, 170, 0.8) 1px, transparent 2px),
        radial-gradient(circle, rgba(108, 99, 255, 0.7) 1px, transparent 2px);
      background-size: 130px 130px, 110px 110px, 95px 95px, 140px 140px;
      animation: twinkle 7s linear infinite;
      opacity: 0.95;
    }

    .glitter::before {
      animation-duration: 10s;
      transform: scale(1.2);
      opacity: 0.75;
    }

    .glitter::after {
      animation-duration: 13s;
      transform: scale(1.35);
      opacity: 0.55;
    }

    @keyframes twinkle {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(-130px);
      }
    }

    @keyframes glow {
      from {
        transform: scale(1);
      }
      to {
        transform: scale(1.05);
      }
    }
  </style>
</head>
<body>
  <div class="glitter" aria-hidden="true"></div>
  <h1>You are awesome ✨</h1>
</body>
</html>
